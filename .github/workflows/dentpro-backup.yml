name: DentPro OS Database Backup Test

on:
  workflow_dispatch:
    inputs:
      backup_id:
        description: 'Supabase backup_history UUID'
        required: false
        type: string

jobs:
  backup:
    name: Create Logical Database Backup & Encrypted Off-Site Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lsb-release wget gnupg
          sudo install -d /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install Python backup dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet cryptography requests

      - name: Create, Encrypt, and Upload Database Backup to Google Drive
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BACKUP_CALLBACK_SECRET: ${{ secrets.BACKUP_CALLBACK_SECRET }}
          BACKUP_ID: ${{ github.event.inputs.backup_id }}
        run: |
          set -euo pipefail

          # Verify required secret environment variables are present without printing values
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Error: SUPABASE_DB_URL secret is not set or empty." >&2
            exit 1
          fi
          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "Error: BACKUP_ENCRYPTION_KEY secret is not set or empty." >&2
            exit 1
          fi
          if [ -z "${GOOGLE_DRIVE_CLIENT_ID:-}" ]; then
            echo "Error: GOOGLE_DRIVE_CLIENT_ID secret is not set or empty." >&2
            exit 1
          fi
          if [ -z "${GOOGLE_DRIVE_CLIENT_SECRET:-}" ]; then
            echo "Error: GOOGLE_DRIVE_CLIENT_SECRET secret is not set or empty." >&2
            exit 1
          fi
          if [ -z "${GOOGLE_DRIVE_REFRESH_TOKEN:-}" ]; then
            echo "Error: GOOGLE_DRIVE_REFRESH_TOKEN secret is not set or empty." >&2
            exit 1
          fi

          # Create a secure temporary directory outside the repository working tree
          TEMP_DIR=$(mktemp -d -p "${{ runner.temp }}" dentpro-backup-XXXXXX)

          # Ensure temporary working directory is deleted upon step completion or failure
          trap 'rm -rf "$TEMP_DIR"' EXIT

          TIMESTAMP=$(date -u +'%Y-%m-%d-%H-%M-%S')
          PLAIN_FILENAME="dentpro-db-${TIMESTAMP}.sql.gz"
          PLAIN_FILEPATH="${TEMP_DIR}/${PLAIN_FILENAME}"
          ENC_FILENAME="${PLAIN_FILENAME}.enc"
          ENC_FILEPATH="${TEMP_DIR}/${ENC_FILENAME}"

          echo "Creating database backup..."
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-subscriptions \
            --no-owner \
            --no-privileges | gzip -9 > "$PLAIN_FILEPATH"

          if [ ! -s "$PLAIN_FILEPATH" ]; then
            echo "Error: Database backup file was not created or is empty." >&2
            exit 1
          fi

          PLAIN_SIZE_KB=$(du -k "$PLAIN_FILEPATH" | cut -f1)
          echo "Backup created: ${PLAIN_FILENAME}"
          echo "Compressed backup size: ${PLAIN_SIZE_KB} KB"

          # Execute inline Python script for AES-256-GCM encryption, OAuth authentication,
          # folder validation, Google Drive upload, and file size verification.
          python3 - "$PLAIN_FILEPATH" "$ENC_FILEPATH" "$ENC_FILENAME" << 'EOF'
          import os
          import sys
          import json
          import base64
          import hashlib
          import requests
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          # ENCRYPTED BACKUP FILE FORMAT:
          # +-------------------+------------------+-------------------+-----------------------------+
          # | MAGIC HEADER (8B) | VERSION (1B)     | NONCE (12B)       | CIPHERTEXT + AUTH TAG (NB)  |
          # | b"DENTPRO1"       | b"\x01"          | os.urandom(12)    | AES-256-GCM Payload         |
          # +-------------------+------------------+-------------------+-----------------------------+
          # Header (9 bytes) is passed as AES-GCM Associated Authenticated Data (AAD).

          MAGIC_HEADER = b"DENTPRO1"
          VERSION = b"\x01"
          HEADER = MAGIC_HEADER + VERSION
          FOLDER_NAME = "DentPro OS Backups"

          plain_filepath = sys.argv[1]
          enc_filepath = sys.argv[2]
          enc_filename = sys.argv[3]

          try:
              # 1. Decode BACKUP_ENCRYPTION_KEY from Base64 into exactly 32 bytes
              key_b64 = os.environ.get("BACKUP_ENCRYPTION_KEY", "")
              if not key_b64:
                  raise RuntimeError("BACKUP_ENCRYPTION_KEY secret environment variable is missing.")

              key_bytes = base64.b64decode(key_b64)
              if len(key_bytes) != 32:
                  raise ValueError(f"Decoded BACKUP_ENCRYPTION_KEY length must be exactly 32 bytes (got {len(key_bytes)} bytes).")

              # 2. Encrypt compressed plaintext dump using AES-256-GCM with a fresh 12-byte random nonce
              print("Encrypting backup...")
              with open(plain_filepath, "rb") as f:
                  plaintext = f.read()

              nonce = os.urandom(12)
              aesgcm = AESGCM(key_bytes)
              ciphertext = aesgcm.encrypt(nonce, plaintext, associated_data=HEADER)

              with open(enc_filepath, "wb") as f:
                  f.write(HEADER)
                  f.write(nonce)
                  f.write(ciphertext)

              # 3. Securely remove plaintext dump immediately after encryption
              if os.path.exists(plain_filepath):
                  os.remove(plain_filepath)

              # 4. Verify encrypted backup existence and size
              if not os.path.exists(enc_filepath) or os.path.getsize(enc_filepath) == 0:
                  raise RuntimeError("Encrypted backup file creation failed or file is empty.")

              enc_size = os.path.getsize(enc_filepath)
              enc_size_kb = round(enc_size / 1024, 2)

              # Calculate SHA-256 checksum of encrypted file
              sha256 = hashlib.sha256()
              with open(enc_filepath, "rb") as f:
                  for chunk in iter(lambda: f.read(65536), b""):
                      sha256.update(chunk)
              enc_hash = sha256.hexdigest()

              print(f"Encrypted backup created: {enc_filename}")
              print(f"Encrypted backup size: {enc_size_kb} KB")
              print(f"SHA-256: {enc_hash}")

              # 5. Obtain Google OAuth Access Token via Refresh Token
              client_id = os.environ.get("GOOGLE_DRIVE_CLIENT_ID", "")
              client_secret = os.environ.get("GOOGLE_DRIVE_CLIENT_SECRET", "")
              refresh_token = os.environ.get("GOOGLE_DRIVE_REFRESH_TOKEN", "")

              token_resp = requests.post(
                  "https://oauth2.googleapis.com/token",
                  data={
                      "client_id": client_id,
                      "client_secret": client_secret,
                      "refresh_token": refresh_token,
                      "grant_type": "refresh_token",
                  },
                  timeout=30,
              )

              if token_resp.status_code != 200:
                  raise RuntimeError(
                      f"Google OAuth token refresh failed (HTTP {token_resp.status_code}). Please verify OAuth credentials."
                  )

              token_data = token_resp.json()
              access_token = token_data.get("access_token")
              if not access_token:
                  raise RuntimeError("Google OAuth token response missing access_token.")

              headers = {"Authorization": f"Bearer {access_token}"}

              # 6. Locate or Create Application-Owned Google Drive Backup Folder
              print(f"Verifying Google Drive backup folder '{FOLDER_NAME}'...")
              search_q = f"mimeType = 'application/vnd.google-apps.folder' and name = '{FOLDER_NAME}' and trashed = false"
              search_url = "https://www.googleapis.com/drive/v3/files"
              search_params = {
                  "q": search_q,
                  "fields": "files(id, name, mimeType, trashed)",
                  "spaces": "drive",
              }

              search_resp = requests.get(search_url, headers=headers, params=search_params, timeout=30)

              if search_resp.status_code != 200:
                  raise RuntimeError(
                      f"Google Drive folder search failed (HTTP {search_resp.status_code})."
                  )

              search_data = search_resp.json()
              matching_files = search_data.get("files", [])

              folder_id = None
              if matching_files:
                  folder_id = matching_files[0].get("id")
                  print(f"Found existing application-owned backup folder (ID: {folder_id}).")
              else:
                  print(f"No existing folder found under drive.file scope. Creating application-owned folder '{FOLDER_NAME}'...")
                  create_url = "https://www.googleapis.com/drive/v3/files?fields=id,name,mimeType"
                  create_body = {
                      "name": FOLDER_NAME,
                      "mimeType": "application/vnd.google-apps.folder",
                  }
                  create_resp = requests.post(create_url, headers=headers, json=create_body, timeout=30)

                  if create_resp.status_code not in (200, 201):
                      raise RuntimeError(
                          f"Failed to create Google Drive folder '{FOLDER_NAME}' (HTTP {create_resp.status_code})."
                      )

                  folder_id = create_resp.json().get("id")
                  if not folder_id:
                      raise RuntimeError("Google Drive folder creation response missing folder ID.")
                  print(f"Created application-owned backup folder (ID: {folder_id}).")

              # 7. Upload Encrypted Backup to Google Drive using RFC 2387 Multipart Upload
              print("Uploading encrypted backup...")
              upload_url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,mimeType,size"

              metadata = {
                  "name": enc_filename,
                  "parents": [folder_id],
              }

              boundary = f"DentProBackupBoundary{os.urandom(8).hex()}"
              multipart_headers = {
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": f"multipart/related; boundary={boundary}",
              }

              metadata_bytes = json.dumps(metadata).encode("utf-8")
              with open(enc_filepath, "rb") as ef:
                  file_bytes = ef.read()

              body = (
                  f"--{boundary}\r\n"
                  f"Content-Type: application/json; charset=UTF-8\r\n\r\n"
              ).encode("utf-8") + metadata_bytes + (
                  f"\r\n--{boundary}\r\n"
                  f"Content-Type: application/octet-stream\r\n\r\n"
              ).encode("utf-8") + file_bytes + (
                  f"\r\n--{boundary}--\r\n"
              ).encode("utf-8")

              upload_resp = requests.post(upload_url, headers=multipart_headers, data=body, timeout=300)

              if upload_resp.status_code not in (200, 201):
                  raise RuntimeError(f"Google Drive upload failed (HTTP {upload_resp.status_code}).")

              drive_file = upload_resp.json()
              drive_file_id = drive_file.get("id")

              # 8. Independent Post-Upload Verification via Separate GET Request
              if not drive_file_id:
                  raise RuntimeError("Google Drive upload response missing file ID.")

              print("Verifying uploaded file in Google Drive...")
              verify_url = f"https://www.googleapis.com/drive/v3/files/{drive_file_id}?fields=id,name,mimeType,size,parents,trashed"
              verify_resp = requests.get(verify_url, headers=headers, timeout=30)

              if verify_resp.status_code != 200:
                  raise RuntimeError(f"Google Drive file verification failed (HTTP {verify_resp.status_code}).")

              verify_data = verify_resp.json()
              v_id = verify_data.get("id")
              v_name = verify_data.get("name")
              v_size = int(verify_data.get("size", 0))
              v_trashed = verify_data.get("trashed", True)
              v_parents = verify_data.get("parents", [])

              if v_id != drive_file_id:
                  raise RuntimeError("Uploaded file ID mismatch during verification.")
              if v_name != enc_filename:
                  raise RuntimeError("Uploaded filename mismatch during verification.")
              if v_size != enc_size:
                  raise RuntimeError(
                      f"Uploaded file size mismatch! Local size: {enc_size} bytes, Drive reported size: {v_size} bytes."
                  )
              if v_trashed:
                  raise RuntimeError("Uploaded file is marked as trashed in Google Drive.")
              if folder_id not in v_parents:
                  raise RuntimeError("Uploaded file parent folder ID mismatch during verification.")

              print("Google Drive upload and verification successful.")
              print(f"Drive file ID: {v_id}")
              print(f"Drive file name: {v_name}")
              print(f"Drive file size: {v_size} bytes")
              print(f"Parent folder ID: {folder_id}")
              print("Backup completed successfully.")

              # 9. Notify Supabase backup-callback Endpoint of Completion
              backup_id = os.environ.get("BACKUP_ID", "")
              supabase_url = os.environ.get("SUPABASE_URL", "")
              callback_secret = os.environ.get("BACKUP_CALLBACK_SECRET", "")

              if backup_id and supabase_url and callback_secret:
                  print("Sending completion status to Supabase backup-callback...")
                  cb_url = f"{supabase_url.rstrip('/')}/functions/v1/backup-callback"
                  try:
                      cb_resp = requests.post(
                          cb_url,
                          headers={
                              "x-callback-secret": callback_secret,
                              "Content-Type": "application/json",
                          },
                          json={
                              "backup_id": backup_id,
                              "status": "completed",
                              "backup_size": v_size,
                              "file_name": v_name,
                          },
                          timeout=30,
                      )
                      print(f"Callback response: HTTP {cb_resp.status_code}")
                  except Exception as cb_err:
                      print(f"Warning: Failed to reach backup-callback: {cb_err}", file=sys.stderr)

          except Exception as e:
              print(f"Error: {e}", file=sys.stderr)
              # Clean up plaintext dump if error occurs
              if os.path.exists(plain_filepath):
                  try:
                      os.remove(plain_filepath)
                  except Exception:
                      pass
              sys.exit(1)
          EOF

      - name: Notify Supabase on Backup Failure
        if: failure() && github.event.inputs.backup_id != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          BACKUP_CALLBACK_SECRET: ${{ secrets.BACKUP_CALLBACK_SECRET }}
          BACKUP_ID: ${{ github.event.inputs.backup_id }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${BACKUP_CALLBACK_SECRET:-}" ] && [ -n "${BACKUP_ID:-}" ]; then
            echo "Reporting backup failure to Supabase backup-callback..."
            curl -s -X POST "${SUPABASE_URL%/}/functions/v1/backup-callback" \
              -H "x-callback-secret: ${BACKUP_CALLBACK_SECRET}" \
              -H "Content-Type: application/json" \
              -d "{\"backup_id\": \"${BACKUP_ID}\", \"status\": \"failed\"}" || true
          fi
